name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt5user
          POSTGRES_PASSWORD: mt5password
          POSTGRES_DB: mt5_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mt5user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py pins the test DB to localhost:5432 (mt5user/mt5password).
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests ../shared/tests
      - name: Mypy
        run: mypy app --show-error-codes
      - name: Pytest (includes live/paper reconcile regression)
        run: pytest tests -q
      - name: Pytest (SDK indicators + mirror golden, P2-7)
        run: pytest ../shared/tests -q

  gateway:
    name: Gateway (ruff + pytest)
    runs-on: windows-latest  # MetaTrader5 wheel is Windows-only
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "ruff~=0.17.0"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest tests -q

  frontend:
    name: Frontend (eslint + tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest (含 SDK 指标镜像对照 P2-7)
        run: npm test -- --run
      - name: Build (tsc -b && vite build → zero type errors required)
        run: npm run build
