# Alembic configuration for the MT5 Quant Platform.
#
# The single important setting below is ``script_location`` which points at
# the ``alembic/`` migration directory.  The actual SQLAlchemy engine URL is
# read from our application settings inside ``alembic/env.py`` — do **not**
# hard-code a ``sqlalchemy.url`` here.

[alembic]
script_location = alembic

# Logging
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# Limit the precision of ``AlterColumn`` types that Alembic considers
# "changed" — avoids spurious migration diffs for types like ``VARCHAR``.
prepend_sys_path = .
compare_type = True

# Database URL is set programmatically inside ``alembic/env.py``.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S