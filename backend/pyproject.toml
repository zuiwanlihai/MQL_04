[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-quant-platform"
version = "0.1.0"
description = "MT5 Web Quantitative Trading Platform Backend"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.1.0",
    # Redis/Celery removed P2-3: zero consumers (pair_store uses in-memory dict)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=2.3.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "psutil>=5.9.8",
    "numpy>=1.26.3",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "coverage>=7.4.0",
    "black>=24.1.0",
    "ruff~=0.17.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # autogenerated migration scripts

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
# strict 模式一次性开了 type-arg / no-untyped-def 等 800+ 风格化检查，
# 不现实。当前只保留能抓真实 bug 的检查项，后续逐个 enable 收紧。
# 显式开启项：attr-defined / valid-type / arg-type / return-value / no-any-return
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
warn_unused_configs = false
warn_unused_ignores = false