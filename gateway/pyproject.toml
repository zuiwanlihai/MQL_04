[project]
name = "mt5-gateway"
version = "1.0.0"
description = "Local MT5 gateway — bridges the MetaTrader 5 terminal to the backend over HTTP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psutil>=6.0",
    "MetaTrader5==5.0.6231",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
